name: ruptura
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - clangxx>=21
  - cmake>=3.28
  - ninja
  - scikit-build-core>=0.10
  - nanobind>=2.2
  - libopenblas
  - liblapack
  - suitesparse
  - sundials=7.5
  - numpy>=1.24
  - matplotlib>=3
  - pandas
  - plotly
  - jupyterlab
  - ipywidgets
  - pytest
  - gtest
  - doxygen
  - graphviz
variables:
  CC: clang
  CXX: clang++
